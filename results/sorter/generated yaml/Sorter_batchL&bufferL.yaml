behaviors:
  Sorter:
    hyperparameters:
      batch_size: 128
      beta: 0.005
      buffer_size: 10240
      epsilon: 0.2
      lambd: 0.95
      learning_rate: 0.0003
      learning_rate_schedule: constant
      num_epoch: 3
    keep_checkpoints: 5
    max_steps: 1000000
    network_settings:
      hidden_units: 128
      normalize: false
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    summary_freq: 10000
    time_horizon: 256
    trainer_type: ppo
