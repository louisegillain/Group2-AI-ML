behaviors:
  SoccerTwos:
    hyperparameters:
      batch_size: 2048
      beta: 0.005
      buffer_size: 20480
      epsilon: 0.2
      lambd: 0.95
      learning_rate: 0.0003
      learning_rate_schedule: constant
      num_epoch: 3
    keep_checkpoints: 5
    max_steps: 3000000
    network_settings:
      hidden_units: 128
      normalize: false
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    self_play:
      initial_elo: 1200.0
      play_against_latest_model_ratio: 0.5
      save_steps: 50000
      swap_steps: 2000
      team_change: 200000
      window: 10
    summary_freq: 10000
    time_horizon: 1000
    trainer_type: poca
